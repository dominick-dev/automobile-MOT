name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment
            You are running non-interactively in CI: this session ends as soon as you end your turn. Run every subagent in the foreground and wait for its result. Do not schedule wakeups or end your turn until the review comment is posted.
            ${{ github.event.action == 'synchronize' && format('This is a follow-up push. Focus on changes in {0}..{1} and check whether they address earlier review comments; do not repeat comments on unchanged code.', github.event.before, github.event.after) || '' }}
          claude_args: |
                --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
                --disallowedTools "ScheduleWakeup"
          show_full_output: true
